  <g transform="translate(-12 14) rotate(140)"><path d="M0 0 C 9 -8, 24 -8, 32 0 C 24 8, 9 8, 0 0 Z" fill="#8fb27a" stroke="#4f7a3f" stroke-width="1.1"/><path d="M2 0 L 29 0" stroke="#4f7a3f" stroke-width=".8" stroke-opacity=".7"/></g>
