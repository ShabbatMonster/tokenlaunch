<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Deco fan-scale tile. Each fan is a full circle filled with the
       background and lined in gold, drawn row by row from the top so each row
       overlaps the one above and only the upper half of every fan shows.
       Every point is covered by circles in ascending-centre order on both
       sides of each tile edge, so the repeat is seamless. -->
  <defs>
    <g id="fan">
      <circle r="30" fill="#0e0d0b"/>
      <g fill="none" stroke="#d4af37">
        <circle r="29.3" stroke-opacity=".34" stroke-width="1.1"/>
        <circle r="22" stroke-opacity=".2" stroke-width=".8"/>
        <circle r="14" stroke-opacity=".2" stroke-width=".8"/>
        <circle r="6" stroke-opacity=".28" stroke-width=".8"/>
        <path stroke-opacity=".16" stroke-width=".7"
          d="M0 0 L-29 0 M0 0 L-26.8 -11.1 M0 0 L-20.5 -20.5 M0 0 L-11.1 -26.8 M0 0 L0 -29 M0 0 L11.1 -26.8 M0 0 L20.5 -20.5 M0 0 L26.8 -11.1 M0 0 L29 0"/>
      </g>
    </g>
  </defs>
  <rect width="60" height="60" fill="#0e0d0b"/>
  <use href="#fan" x="30" y="-30"/>
  <use href="#fan" x="0" y="0"/><use href="#fan" x="60" y="0"/>
  <use href="#fan" x="30" y="30"/>
  <use href="#fan" x="0" y="60"/><use href="#fan" x="60" y="60"/>
</svg>
