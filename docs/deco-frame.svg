<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Card frame for border-image, sliced 32px from each edge: the four
       32x32 corners are the stepped deco ornament, the four edges between
       them are a double gold rule that stretches to any length. One corner is
       drawn and mirrored into the other three, so they always match. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8832a"/>
    </linearGradient>
    <g id="corner" fill="none" stroke="url(#g)">
      <!-- outer and inner rules, turning the corner -->
      <path d="M3 32 V3 H32" stroke-width="2.2"/>
      <path d="M11 32 V11 H32" stroke-width="1.3"/>
      <!-- the stepped block: three stairs into the corner -->
      <path d="M3 3 H24 V7 H14 V10 H10 V14 H7 V24 H3 Z" fill="url(#g)" stroke="none"/>
      <!-- a diamond where the rules meet -->
      <path d="M19 13.5 L24.5 19 L19 24.5 L13.5 19 Z" fill="url(#g)" stroke="none"/>
      <path d="M28 11 V19 M11 28 H19" stroke-width="1.3"/>
    </g>
  </defs>
  <use href="#corner"/>
  <use href="#corner" transform="translate(96 0) scale(-1 1)"/>
  <use href="#corner" transform="translate(0 96) scale(1 -1)"/>
  <use href="#corner" transform="translate(96 96) scale(-1 -1)"/>
  <!-- the edges: two parallel rules, matching the corners' -->
  <g stroke="url(#g)" fill="none">
    <path d="M32 3 H64 M32 93 H64 M3 32 V64 M93 32 V64" stroke-width="2.2"/>
    <path d="M32 11 H64 M32 85 H64 M11 32 V64 M85 32 V64" stroke-width="1.3"/>
  </g>
</svg>
