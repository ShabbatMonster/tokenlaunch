<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Petunia wallpaper tile: pink and periwinkle petunias on sage vines over
       a cream-and-blush regency stripe. Every bloom is one shape coloured by
       currentColor; its throat, veins and outline are black at low opacity,
       so the same drawing reads as pink or blue. Nothing crosses the tile
       edge, so it repeats without seams. -->
  <defs>
    <radialGradient id="throat">
      <stop offset="0" stop-color="#2a0f1f" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#2a0f1f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2a0f1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sheen" cx=".38" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- five round lobes, outlined only on the outside: the stroked pass is
         covered by a second fill pass, which hides every inner overlap -->
    <g id="bloom">
      <g fill="currentColor" stroke="#2a0f1f" stroke-opacity=".32" stroke-width="2.4">
        <circle cx="0" cy="-15" r="14"/><circle cx="14.3" cy="-4.6" r="14"/><circle cx="8.8" cy="12.1" r="14"/>
        <circle cx="-8.8" cy="12.1" r="14"/><circle cx="-14.3" cy="-4.6" r="14"/>
      </g>
      <g fill="currentColor">
        <circle cx="0" cy="-15" r="14"/><circle cx="14.3" cy="-4.6" r="14"/><circle cx="8.8" cy="12.1" r="14"/>
        <circle cx="-8.8" cy="12.1" r="14"/><circle cx="-14.3" cy="-4.6" r="14"/><circle r="15"/>
      </g>
      <circle r="27" fill="url(#sheen)"/>
      <g stroke="#2a0f1f" stroke-opacity=".28" stroke-width="1" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-22"/><line x1="0" y1="0" x2="21" y2="-6.8"/><line x1="0" y1="0" x2="12.9" y2="17.8"/>
        <line x1="0" y1="0" x2="-12.9" y2="17.8"/><line x1="0" y1="0" x2="-21" y2="-6.8"/>
      </g>
      <circle r="10" fill="url(#throat)"/>
      <circle r="2.8" fill="#f3df7a" stroke="#2a0f1f" stroke-opacity=".3" stroke-width=".8"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C 9 -8, 24 -8, 32 0 C 24 8, 9 8, 0 0 Z" fill="#8fb27a" stroke="#4f7a3f" stroke-width="1.1"/>
      <path d="M2 0 L 29 0" stroke="#4f7a3f" stroke-width=".8" stroke-opacity=".7"/>
    </g>
    <g id="bud">
      <path d="M0 0 C -5 -6, -4 -18, 0 -24 C 4 -18, 5 -6, 0 0 Z" fill="currentColor" stroke="#2a0f1f" stroke-opacity=".3" stroke-width="1.2"/>
      <path d="M0 0 L -5 -7 M0 0 L 5 -7 M0 0 L 0 -8" stroke="#4f7a3f" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- regency stripe: cream ground, blush bands, a hairline either side -->
  <rect width="240" height="240" fill="#fbf2e7"/>
  <g fill="#f7e1e7">
    <rect x="9" width="12" height="240"/><rect x="69" width="12" height="240"/>
    <rect x="129" width="12" height="240"/><rect x="189" width="12" height="240"/>
  </g>
  <g stroke="#ecc4d2" stroke-width="1">
    <path d="M6.5 0V240M23.5 0V240M66.5 0V240M83.5 0V240M126.5 0V240M143.5 0V240M186.5 0V240M203.5 0V240"/>
  </g>

  <!-- vines -->
  <g fill="none" stroke="#7fa56d" stroke-width="1.8" stroke-linecap="round">
    <path d="M62 70 C 78 104, 70 128, 92 150 C 110 168, 140 170, 180 182"/>
    <path d="M62 70 C 92 54, 140 40, 186 56"/>
    <path d="M56 190 C 74 176, 80 160, 92 150"/>
    <path d="M186 56 C 196 92, 206 120, 214 132"/>
  </g>

  <!-- leaves -->
  <use href="#leaf" transform="translate(70 104) rotate(58)"/>
  <use href="#leaf" transform="translate(96 152) rotate(-24)"/>
  <use href="#leaf" transform="translate(120 46) rotate(-160)"/>
  <use href="#leaf" transform="translate(150 172) rotate(196)"/>
  <use href="#leaf" transform="translate(200 96) rotate(30) scale(.8)"/>
  <use href="#leaf" transform="translate(70 178) rotate(-120) scale(.75)"/>
  <use href="#leaf" transform="translate(30 40) rotate(-150) scale(.7)"/>

  <!-- buds -->
  <use href="#bud" color="#e8649c" transform="translate(214 132) rotate(30)"/>
  <use href="#bud" color="#8a9be6" transform="translate(120 112) rotate(-35)"/>
  <use href="#bud" color="#e8649c" transform="translate(28 120) rotate(-10) scale(.85)"/>

  <!-- blooms: the big pink one, the big blue one a half-drop away, and two small -->
  <use href="#bloom" color="#ec6fa0" transform="translate(62 70) rotate(8) scale(1.25)"/>
  <use href="#bloom" color="#7f95e2" transform="translate(180 182) rotate(-14) scale(1.15)"/>
  <use href="#bloom" color="#93a5ec" transform="translate(186 56) rotate(22) scale(.7)"/>
  <use href="#bloom" color="#f08ab3" transform="translate(56 190) rotate(-18) scale(.74)"/>
</svg>
