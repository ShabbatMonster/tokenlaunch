<svg xmlns="http://www.w3.org/2000/svg" width="96" height="40" viewBox="0 0 96 40">
  <!-- The crest set into the top edge of every card: a rising sun fanned out
       over a stepped base. The black backing plate is what lets it sit over
       the card's frame and break the rule cleanly. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset=".55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9c7a1e"/>
    </linearGradient>
  </defs>
  <!-- backing plate with stepped shoulders -->
  <path d="M14 40 V30 H22 V22 H30 V14 H66 V22 H74 V30 H82 V40 Z" fill="#15130f"/>
  <!-- the sun: rays, then arcs -->
  <g stroke="url(#g)" fill="none" stroke-linecap="round">
    <path stroke-width="1.3" d="M48 34 L48 4 M48 34 L36.5 6.3 M48 34 L59.5 6.3 M48 34 L26.8 12.8 M48 34 L69.2 12.8 M48 34 L20.3 22.5 M48 34 L75.7 22.5"/>
  </g>
  <path d="M30 34 A18 18 0 0 1 66 34 Z" fill="#15130f" stroke="url(#g)" stroke-width="1.6"/>
  <path d="M37 34 A11 11 0 0 1 59 34" fill="none" stroke="url(#g)" stroke-width="1.2"/>
  <path d="M43 34 A5 5 0 0 1 53 34 Z" fill="url(#g)"/>
  <!-- stepped base rule -->
  <path d="M14 36.5 H82" stroke="url(#g)" stroke-width="1.6"/>
  <path d="M22 30.5 H30 M66 30.5 H74" stroke="url(#g)" stroke-width="1"/>
</svg>
