<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pump migrate — options</title>
<style>
  :root { --bg:#0b0d10; --panel:#14171c; --panel2:#1a1e24; --border:#262b33;
          --text:#e6e9ee; --dim:#8a93a1; --accent:#4ade80; --danger:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); padding: 24px 16px;
         font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
         display: flex; justify-content: center; }
  .app { width: 100%; max-width: 520px; }
  h1 { font-size: 14px; letter-spacing: 3px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .card + .card { margin-top: 14px; }
  label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--dim); margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  input, select { width: 100%; background: var(--panel2); border: 1px solid var(--border);
          border-radius: 8px; color: var(--text); padding: 9px 11px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: #3b4453; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  button { margin-top: 14px; padding: 11px; border: none; border-radius: 9px; width: 100%;
           background: var(--accent); color: #04160b; font: inherit; font-weight: 700;
           letter-spacing: 2px; cursor: pointer; }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .state { margin-top: 10px; font-size: 12px; color: var(--dim); word-break: break-all; }
  .ok { color: var(--accent); } .err { color: var(--danger); } .warn { color: var(--warn); }
  .dim { color: var(--dim); }
  .note { font-size: 11px; color: var(--dim); margin-top: 10px; line-height: 1.55; }
  #stuck .row { margin-top: 6px; font-size: 12px; }
  #stuck a { color: var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>PUMP MIGRATE</h1>

  <div class="card">
    <label>SOLANA KEY</label>
    <input id="secretKey" placeholder="base58 or a 64-byte JSON array — leave blank to keep the current one"
           spellcheck="false" autocomplete="off">
    <div class="state" id="keyState"></div>
    <button class="secondary" id="import">IMPORT FROM LAUNCHER</button>
    <p class="note">The key is stored by the extension and read only by its service worker. No page
      ever receives it, and nothing a page sends can ask for it.</p>
  </div>

  <div class="card">
    <label>RPC</label>
    <input id="rpcUrl" spellcheck="false" autocomplete="off">
    <div class="row2">
      <div><label>SLIPPAGE %</label><input id="slippage" spellcheck="false" autocomplete="off"></div>
      <div><label>JITO TIP (SOL)</label><input id="tip" spellcheck="false" autocomplete="off"></div>
    </div>
    <label>ROUTE</label>
    <select id="route">
      <option value="auto">one transaction (bundle only if it will not fit)</option>
      <option value="bundle">always a Jito bundle</option>
    </select>
    <button id="save">SAVE</button>
    <div class="state" id="saveState"></div>
  </div>

  <div class="card">
    <label>STUCK METEORA POOLS</label>
    <p class="note">Every Meteora DBC pool this wallet launched whose curve finished and never
      migrated — the case this tool exists for.</p>
    <button class="secondary" id="scan">SCAN</button>
    <div class="state" id="stuckState"></div>
    <div id="stuck"></div>
  </div>
</div>
<script src="options.js"></script>
</body>
</html>
